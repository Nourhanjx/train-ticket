# Auto-generated docker-compose for train-ticket, wired for MySQL + Nacos + Zipkin tracing.
# Base images are pulled through mirror.gcr.io (Google's Docker Hub read-through mirror)
# because this environment's egress policy blocks Docker Hub's blob CDN directly.

services:

  ts-mysql:
    image: mirror.gcr.io/library/mysql:5.7
    container_name: ts-mysql
    restart: always
    command: ["--max-connections=1000"]
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./deployment/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - my-network

  nacos:
    image: mirror.gcr.io/nacos/nacos-server:latest
    container_name: nacos
    restart: always
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      NACOS_AUTH_TOKEN: "VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg5MA=="
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
    ports:
      - "8848:8848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8848/nacos/"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - my-network

  zipkin:
    image: mirror.gcr.io/openzipkin/zipkin
    container_name: zipkin
    restart: always
    depends_on:
      ts-mysql:
        condition: service_healthy
    environment:
      STORAGE_TYPE: mysql
      MYSQL_HOST: ts-mysql
      MYSQL_TCP_PORT: "3306"
      MYSQL_DB: zipkin
      MYSQL_USER: root
      MYSQL_PASS: root
    ports:
      - "9411:9411"
    networks:
      - my-network

  ts-admin-basic-info-service:
    build:
      context: ts-admin-basic-info-service
    image: train-ticket/ts-admin-basic-info-service:zipkin
    container_name: ts-admin-basic-info-service
    restart: on-failure
    ports:
      - "18767:18767"
    depends_on:
      nacos:
        condition: service_healthy
    environment:
      NACOS_ADDRS: "nacos:8848"
      SPRING_ZIPKIN_BASE_URL: "http://zipkin:9411/"
      SPRING_SLEUTH_SAMPLER_PROBABILITY: "1.0"
      JAVA_OPTS: "-Xmx320m -Xss256k -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
    networks:
      - my-network

  ts-admin-order-service:
    build:
      context: ts-admin-order-service
